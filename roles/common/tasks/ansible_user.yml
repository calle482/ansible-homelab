- name: Create ansible user
  ansible.builtin.user:
    name: ansible
    password: '!'
    password_expire_max: 999999
    expires: -1
    shell: /bin/bash

- name: Copy ansible user public key
  ansible.posix.authorized_key:
    user: ansible
    state: present
    key: "{{ lookup('file', 'ansible_ed25519_key.pub') }}"
